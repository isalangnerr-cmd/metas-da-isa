<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Metas da Isa</title>
<meta name="theme-color" content="#2E0F17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Metas da Isa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}
body[data-view="login"] .tabs, body[data-view="login"] .fab, body[data-view="login"] .top .stats, body[data-view="login"] .top .nivel{display:none!important}
.login{display:grid;gap:12px;max-width:420px;margin:24px auto}.login input{width:100%}.login .msg{font-size:14px;color:var(--muted)}
.ag-card input{width:100%;margin:8px 0}.ag-card ol{margin:6px 0 4px;padding-left:20px;line-height:1.5}
.avisos-card{display:grid;gap:8px}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: app de celular. Cabeçalho com o pote de estrelas e a sequência, conteúdo em uma coluna (máx 720px), barra de abas fixa embaixo. Uma cor viva por área da vida. */
/* identidade "adesivinhos · cereja e creme": sempre escura (vinho), cereja e creme como cores de destaque,
   blocos com borda branca que parecem adesivos, letras redondinhas Fredoka + Nunito */
:root,:root[data-theme="light"],:root[data-theme="dark"]{
  --bg:#2E0F17; --surface:#451A25; --surface2:#5A2432; --ink:#FFF4EC; --muted:#EBC6CC; --line:#6B2E3D;
  --cereja:#FF4D6A; --creme:#FFE8C7; --creme-ink:#5A2A10; --sticker:#FFFFFF;
  --roxo:#FFC2CD; --verm:#FF4D6A; --amar:#FFD59A; --rosa:#FFC2CD; --verde:#FFD9A8; --azul:#FFB3C1;
  --a-carreira:#FFD59A; --a-saude:#FF9E7A; --a-familia:#FF4D6A; --a-eu:#FFC2CD;
  --pote:var(--cereja);
  --on-accent:#2E0F17; --shadow:0 4px 0 rgba(0,0,0,.28);
  --display:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:22px; color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amar);outline-offset:2px;border-radius:10px}
.st{width:1em;height:1em;display:inline-block;vertical-align:-.12em;fill:currentColor}
.num{font-variant-numeric:tabular-nums}

/* topo */
.top{padding-top:18px;display:grid;gap:14px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:700;font-size:22px;color:var(--roxo);display:flex;align-items:center;gap:6px}
.logo .st{color:var(--verm)}
.logo small{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.icon-btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.pote{background:var(--pote);color:#fff;border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pote .big{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
.pote .lbl{font-size:12px;font-weight:700;opacity:.85;letter-spacing:.04em}
.pote .st-bg{position:absolute;right:-14px;top:-14px;width:84px;height:84px;color:#fff;opacity:.28}
.pote.pop .big{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.seq{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.seq .big{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;color:var(--verm)}
.seq .big .fogo{font-size:22px;margin-right:2px}
.seq.vivo{border-color:color-mix(in srgb,var(--verm) 45%,var(--line))}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.area-card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:6px;text-align:left;width:100%}
.area-card .nivel-row{font-size:13px}
.area-card .nivel-row span:first-child{color:var(--area)}
.area-card .bar i{background:var(--area)}
.area-card small{color:var(--muted);font-weight:700;font-size:11.5px}
.seq .lbl{font-size:12px;color:var(--muted);font-weight:700}
.nivel{display:grid;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 14px}
.nivel-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700}
.nivel-row span:last-child{color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--verm),var(--amar));transition:width .6s cubic-bezier(.3,1.4,.5,1)}

main{padding-top:18px;display:grid;gap:22px}
.banner{font-size:13px;font-weight:600;background:var(--surface2);border-radius:12px;padding:10px 12px;color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-size:21px}
.hint{color:var(--muted);font-size:13px;margin:2px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:800;letter-spacing:.03em;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.area{background:color-mix(in srgb,var(--area) 16%,transparent);color:var(--area)}
.tag.ex{border:1.5px dashed var(--line);background:transparent}
.tag.late{background:color-mix(in srgb,var(--verm) 16%,transparent);color:var(--verm)}

.hello h1{font-size:30px;color:var(--ink)}
.hello h1 .st{color:var(--verm)}
.hello p{margin:4px 0 0;color:var(--muted);font-weight:600;max-width:60ch}

/* passinhos */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px 10px 10px}
.step .txt{min-width:0}
.step b{display:block;font-weight:700;overflow-wrap:anywhere}
.step small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.chk{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--area,var(--roxo));background:transparent;display:grid;place-items:center;color:transparent;transition:transform .15s}
.chk:hover{transform:scale(1.06)}
.chk:active{transform:scale(.92)}
.chk .st{width:22px;height:22px}
.done .chk{background:var(--area,var(--roxo));color:var(--on-accent)}
.done b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.tmin{font-size:12px;font-weight:800;color:var(--muted);background:var(--surface2);border-radius:8px;padding:3px 7px;white-space:nowrap}
.pts{font-size:12px;font-weight:800;color:var(--verm)}
.hdots{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.hd{width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:11px;font-weight:800;color:var(--muted);display:grid;place-items:center;padding:0}
.hd.ok{background:var(--area);border-color:var(--area);color:var(--on-accent)}
.hd.hoje{border-color:var(--area);border-width:2px}
.hd:disabled{opacity:.35}
.hab.done b{text-decoration:none;color:var(--ink)}
.tbtns{display:flex;align-items:center;gap:2px}
.foco{border:0;background:none;font-size:21px;line-height:1;color:var(--line);padding:4px 6px;border-radius:8px}
.foco.on{color:var(--amar)}
.step small .tag{margin:3px 6px 0 0}
.addf{margin-top:10px;align-items:stretch}
.addf select.field{flex:1 1 120px}
.ver-tudo{border:0;background:none;color:var(--roxo);font-weight:800;font-size:13px;padding:4px 0}
body[data-view="rotina"] .fab,body[data-view="leituras"] .fab{display:none}
body:not([data-view="hoje"]) .top .stats,body:not([data-view="hoje"]) .top .nivel{display:none}
.leit-hero{background:linear-gradient(135deg,color-mix(in srgb,var(--a-eu) 18%,var(--surface)),var(--surface));border:2px solid color-mix(in srgb,var(--a-eu) 45%,var(--line));border-radius:var(--r);padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.leit-hero h2{color:var(--a-eu)}
.leit-hero .livro{border-color:color-mix(in srgb,var(--a-eu) 35%,var(--line))}
.leit-hero p{margin:0;color:var(--muted);font-weight:600}
.livros{display:grid;gap:8px}
.livro{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:9px}
.livro.lendo{border-color:color-mix(in srgb,var(--a-eu) 55%,var(--line))}
.livro-top{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit}
.livro b{display:block;font-weight:700;overflow-wrap:anywhere}
.livro small{display:block;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.nota{color:var(--amar);font-size:15px;letter-spacing:1px;white-space:nowrap}
.lrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pagf{display:flex;gap:6px;flex:1 1 150px}
.pagf .field{flex:1 1 70px;min-width:0}
.estrelas{display:flex;gap:2px}
.estrelas button{border:0;background:none;font-size:28px;line-height:1;color:var(--line);padding:0 2px}
.estrelas button.on{color:var(--amar)}
.lstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media (max-width:480px){.lstats{grid-template-columns:repeat(2,1fr)}}
.meta-leit{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:6px;font-weight:700;font-size:13.5px}
.meta-leit.ok{border-color:color-mix(in srgb,var(--a-eu) 55%,var(--line))}
.meta-leit .nivel-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.agora{background:linear-gradient(135deg,color-mix(in srgb,var(--verde) 14%,var(--surface)),var(--surface));border:2px solid color-mix(in srgb,var(--verde) 40%,var(--line));border-radius:var(--r);padding:12px 14px;display:grid;gap:8px;box-shadow:var(--shadow)}
.agora .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.agora .rh b{font-family:var(--display);font-weight:600;font-size:16px}
.agora .rh button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;color:var(--muted)}
.agora p{margin:0;color:var(--muted);font-weight:600;font-size:13.5px}
.agora p b{color:var(--ink)}
.dobra{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden}
.dobra>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:none;border:0;padding:12px 14px;font:inherit;font-weight:800;color:var(--ink);text-align:left;cursor:pointer}
.dobra>button small{color:var(--muted);font-weight:700;font-size:12.5px}
.dobra>button .caret{transition:transform .2s}
.dobra>button[aria-expanded="true"] .caret{transform:rotate(180deg)}
.dobra .dobra-in{padding:0 14px 14px;display:grid;gap:14px}
.dobra .dobra-in>section{margin:0}
.ag-livre .riscar{margin-top:4px;border:1.5px solid color-mix(in srgb,var(--verde) 55%,var(--line));background:var(--surface);color:var(--verde);border-radius:999px;padding:3px 10px;font:inherit;font-weight:800;font-size:12px;cursor:pointer}
.seg{display:flex;gap:4px;background:var(--surface2);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px;font:inherit;font-weight:800;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--roxo);box-shadow:var(--shadow)}
.lstats div{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center}
.lstats b{display:block;font-family:var(--display);font-size:24px}
.lstats small{color:var(--muted);font-size:12px;font-weight:700}
.livro textarea.field{width:100%;min-height:90px;font:inherit;resize:vertical}
.livro .tags{display:flex;gap:5px;flex-wrap:wrap}
.livro .lab{font-size:12.5px;font-weight:800;color:var(--muted)}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted);font-weight:600}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;font-weight:600;margin-bottom:4px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px}
.week div{display:grid;gap:4px;justify-items:center;font-size:11px;font-weight:800;color:var(--muted);height:100%;align-content:end}
.week i{display:block;width:100%;max-width:34px;border-radius:8px;background:var(--surface2);min-height:6px}
.week .on i{background:var(--verm)}
.week .hoje{color:var(--ink)}

/* metas */
.horiz{display:grid;gap:10px}
.horiz-h{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.horiz-h h3{font-size:17px}
.horiz-h span{color:var(--muted);font-size:13px;font-weight:700}
.meta{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;position:relative}
.meta-top{padding-right:52px!important}
.del{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);display:grid;place-items:center}
.del svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.del:hover{color:var(--verm);border-color:var(--verm)}
.confirm{margin:0 14px 14px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--verm) 10%,transparent);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700}
.confirm span{flex:1 1 160px}
.fab{position:fixed;z-index:25;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));border:0;border-radius:999px;background:var(--verm);color:#fff;font-family:var(--display);font-weight:600;font-size:17px;padding:13px 20px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--verm) 70%,transparent)}
.fab b{font-size:24px;line-height:.8}
/* desafio da semana */
.desafio{background:var(--surface);border:2px solid var(--area);border-radius:var(--r);padding:14px;display:grid;gap:10px;box-shadow:var(--shadow)}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.d-top small{font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--area)}
.d-top button{border:0;background:none;color:var(--muted);font-weight:800;font-size:13px;text-decoration:underline;padding:4px}
.desafio h3{font-size:20px}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dia{border:2px solid var(--line);background:var(--surface);border-radius:12px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--muted);padding:0}
.dia.hoje{border-color:var(--area);color:var(--ink)}
.dia.ok{background:var(--area);border-color:var(--area);color:#fff}
.dia:disabled{opacity:.4;cursor:default}
.d-foot{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;color:var(--muted);flex-wrap:wrap}
.d-foot b{color:var(--ink)}
.desafio.venceu{background:color-mix(in srgb,var(--area) 10%,var(--surface))}
/* relâmpago */
.relampago{background:var(--surface2);border-radius:var(--r);padding:12px;display:grid;gap:8px}
.relampago .rh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.relampago .rh b{font-family:var(--display);font-weight:600;font-size:16px}
.relampago .rh button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;color:var(--muted)}
/* troféu */
.trofeu-bg{position:fixed;inset:0;z-index:55;background:rgba(22,15,42,.6);display:grid;place-items:center;padding:20px}
.trofeu{background:var(--surface);border-radius:28px;max-width:380px;width:100%;padding:26px 22px;display:grid;gap:8px;text-align:center;justify-items:center;animation:tin .5s cubic-bezier(.3,1.6,.5,1);border:3px solid var(--area)}
.trofeu .copa{font-size:76px;line-height:1;animation:balanca 1.6s ease-in-out infinite}
@keyframes balanca{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
.trofeu small{font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--area);font-size:12px}
.trofeu h3{font-size:24px}
.trofeu p{margin:0;color:var(--muted);font-weight:700}
.trofeu .btn{margin-top:8px}
.estante{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.taca{background:var(--surface);border:1.5px solid var(--line);border-bottom:6px solid var(--area);border-radius:16px;padding:14px 12px 12px;display:grid;gap:4px;justify-items:center;text-align:center}
.taca span{font-size:34px;line-height:1}
.taca b{font-family:var(--display);font-weight:600;font-size:14.5px;line-height:1.2;overflow-wrap:anywhere}
.taca small{color:var(--muted);font-size:12px;font-weight:700}
.fab:active{transform:scale(.95)}
.meta.concl{border-color:var(--area)}
.meta-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px;width:100%;text-align:left;background:none;border:0}
.meta-top .info{min-width:0;display:grid;gap:5px}
.meta-top h4{margin:0;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.meta-top .row{display:flex;gap:6px;flex-wrap:wrap}
.ring{width:52px;height:52px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-size:12.5px;font-weight:800}
.caret{color:var(--muted);transition:transform .2s;font-size:18px}
.open .caret{transform:rotate(180deg)}
.why{margin:0 14px 12px;padding:8px 12px;border-left:3px solid var(--area);background:color-mix(in srgb,var(--area) 7%,transparent);border-radius:0 10px 10px 0;font-size:13.5px;color:var(--ink);font-weight:600}
.why::before{content:"por quê: ";color:var(--muted);font-weight:800}
.nextl{margin:0 14px 14px;font-size:13px;color:var(--muted);font-weight:600}
.nextl b{color:var(--ink)}
.body{border-top:1.5px solid var(--line);padding:14px;display:grid;gap:14px;background:color-mix(in srgb,var(--surface2) 35%,var(--surface))}

  document.addEventListener('visibilitychange', () => { if(!document.hidden) Object.keys(subs).forEach(agenda); });
  const listen = (col, fn, err) => { (subs[col] = subs[col]||[]).push(fn); if(cache[col]) fn(); else load(col).catch(e => err && err({code: e.code || e.message || 'erro'})); };
  return {
    collection: col => ({ onSnapshot(cb, err){ listen(col, () => cb({docs:[...cache[col]].map(([id,d]) => ({id, data:() => d})), metadata:{fromCache:false}}), err); } }),
    doc(path){ const [col, id] = path.split('/'); return {
      async set(d){ const {error} = await sb.from(T).upsert({user_id:uidv, colecao:col, id, dados:d, atualizado:new Date().toISOString()}); if(error) throw error; if(cache[col]) cache[col].set(id, d); },
      async delete(){ const {error} = await sb.from(T).delete().eq('colecao', col).eq('id', id); if(error) throw error; if(cache[col]) cache[col].delete(id); },
      async get(){ const {data, error} = await sb.from(T).select('dados').eq('colecao', col).eq('id', id).maybeSingle(); if(error) throw error; return data ? data.dados : null; },
      onSnapshot(cb, err){ listen(col, () => { const m = cache[col]; cb({exists: m.has(id), data:() => m.get(id), metadata:{fromCache:false}}); }, err); }
    }; }
  };
}

    p.pts = pts; g.estrelas += pts; g.total += pts;

    k.feito = false; delete m.concluidaEm;

  const m = norm(state.metas[mid]); ui.ai[mid] = {status:'loading'}; render();

  const existentes = m.marcos.length ? 'Ela já tem estes marcos (não repita, continue a partir deles): ' + m.marcos.map(k=>k.titulo).join('; ') + '.' : '';
  const prompt = `Você ajuda a Isa a quebrar metas grandes em passinhos pequenos, pra ela sentir progresso todo dia.
Contexto dela: mãe de uma menina pequena (por volta de 1 ano e meio, fase de mexer em tudo, sem telas). Organiza metas de carreira e dinheiro, saúde e corpo, família, e de si mesma (estudos, leitura, lazer). Tem pouco tempo livre e encaixa as coisas nos intervalos (cochilo da filha, à noite). Abre o app várias vezes no dia pra riscar passinhos, então passinhos curtos funcionam melhor. Gosta de humor e linguagem solta.
Meta: "${m.titulo}"
Por que importa: "${m.porque||'-'}"
Horizonte: ${H[m.horizonte]?.nome||m.horizonte} (${H[m.horizonte]?.sub||''}). Prazo: ${m.prazo||'sem prazo'}. Área: ${AREAS[m.area]?.nome||m.area}.
${existentes}
Crie de 3 a 5 marcos em ordem. Cada marco tem de 3 a 5 passinhos concretos que começam com verbo no infinitivo, com no máximo 60 caracteres, em português do Brasil informal e em minúsculas. Cada passinho cabe em 5, 15 ou 60 minutos. O primeiro passinho do primeiro marco tem que ser ridiculamente fácil (5 min). Não invente fatos da vida dela.
Responda só com JSON neste formato: {"marcos":[{"titulo":"...","passos":[{"titulo":"...","tempo":5}]}]}`;
  try{
    const r = await sample.json(prompt, {cache:false});
    const marcos = (r && Array.isArray(r.marcos) ? r.marcos : []).slice(0,6).map(k => ({titulo:String(k.titulo||'marco').slice(0,120), passos:(Array.isArray(k.passos)?k.passos:[]).slice(0,7).map(p=>({titulo:String(p.titulo||'').slice(0,140), tempo:[5,15,60].includes(+p.tempo)?+p.tempo:15})).filter(p=>p.titulo)})).filter(k=>k.passos.length);

    ui.ai[mid] = {status:'error', msg: msgs[e && e.code] || 'não deu certo agora. toca em tentar de novo.'};
  }
  render();
}

/* leituras */
const SENS = ['Tensão','Surpresa','Amor','Risadas','Choro','Transtornada','Indiferença','Decepção'];
const RESP = {pace:'ritmo', writing:'escrita', ending:'final', recommend:'recomendo', reread:'releria'};
function livArr(){ return Object.values(state.livros).filter(l=>l && l.titulo); }
const mesTxt = m => m ? new Date(String(m).slice(0,7)+'-15T12:00').toLocaleDateString('pt-BR',{month:'short',year:'numeric'}).replace('.','').replace(' de ',' ') : '';
function saveLiv(l){ state.livros[l.id] = l; saveDoc('livros', l.id); }
/* progresso sempre em % (Kindle). livros antigos em páginas viram % na primeira leitura */
function pctLiv(l){
  if(l.pct !== undefined && l.pct !== null && !isNaN(+l.pct)) return Math.max(0, Math.min(100, Math.round(+l.pct)));
  return l.paginas ? Math.min(100, Math.round((+l.paginaAtual||0)/l.paginas*100)) : 0;
}
/* ritmo, previsão e meta diária de leitura */
const diasEntre = (a, b) => Math.round((new Date(b+'T12:00') - new Date(a+'T12:00'))/864e5);
const metaLeit = g => Math.max(1, Math.min(50, +((g||{}).metaLeitura) || 3));
function ganhoLiv(l, hoje = dk()){ return l.diaRef === hoje ? Math.max(0, pctLiv(l) - (+l.baseHoje||0)) : 0; }
function ganhoHoje(trocado){ return livArr().map(l => trocado && l.id === trocado.id ? trocado : l).reduce((a,l) => a + ganhoLiv(l), 0); }
function leitStreak(g){
  const ds = (g||{}).leituraDias || {}; const d = new Date(); if(!ds[dk(d)]) d.setDate(d.getDate()-1);
  let n = 0; while(ds[dk(d)]){ n++; d.setDate(d.getDate()-1); } return n;
}
function ritmoLiv(l){
  const d0 = l.rDia || l.inicio; if(!d0) return 0;
  const p0 = l.rDia ? (+l.rPct||0) : (+l.pctInicio||0);
  const dias = Math.max(1, diasEntre(d0, dk()) + (l.rDia ? 0 : 1)), r = (pctLiv(l) - p0) / dias;
  return r > 0 ? r : 0;
}
function previsaoLiv(l){
  const pct = pctLiv(l), r = ritmoLiv(l); if(pct >= 100) return 'chegou no fim ✦';
  if(!r) return l.rDia === dk() ? 'anotado! a partir de amanhã eu calculo quando você termina' : 'anota seu % pra eu calcular quando termina';
  const dias = Math.ceil((100 - pct) / r); if(dias > 365) return 'no ritmo de agora, mais de um ano 😅';
  const f = new Date(); f.setDate(f.getDate() + dias);
  return `no seu ritmo, termina em ~${dias} dia${dias===1?'':'s'} (${f.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}).replace('.','')})`;
}
/* registra um novo % e cuida de estrela, sequência e meta do dia */
function registraPct(id, novo){
  const l = clone(state.livros[id]); if(!l) return; const g = clone(state.geral || defGeral()); const hoje = dk();
  const antes = pctLiv(l); novo = Math.max(0, Math.min(100, Math.round(novo)));
  if(l.diaRef !== hoje){ l.diaRef = hoje; l.baseHoje = antes; }
  /* primeiro % anotado de um livro que já vinha sendo lido: vira ponto de partida, não conta como leitura de hoje */
  const primeira = !l.hist || !Object.keys(l.hist).length;
  if(primeira && novo > antes && ((l.inicio && l.inicio < hoje) || novo - antes > 25)){ l.rDia = hoje; l.rPct = novo; l.baseHoje = novo; }
  l.pct = novo; l.hist = Object.assign({}, l.hist || {}); l.hist[hoje] = novo;
  const ks = Object.keys(l.hist).sort(); while(ks.length > 90) delete l.hist[ks.shift()];
  let estrelas = 0, bateu = false;
  if(novo > antes){
    g.leituraDias = Object.assign({}, g.leituraDias || {}); g.leituraDias[hoje] = true;
    const kd = Object.keys(g.leituraDias).sort(); while(kd.length > 400) delete g.leituraDias[kd.shift()];
    if(l.estrelaDia !== hoje){ l.estrelaDia = hoje; estrelas += 1; }
    if(g.leituraMetaDia !== hoje && ganhoHoje(l) >= metaLeit(g)){ g.leituraMetaDia = hoje; estrelas += 2; bateu = true; }
    if(estrelas){ addStars(g, estrelas); histAdd(g, hoje, 1); }
  }
  saveLiv(l); state.geral = g; saveGeral();
  if(bateu){ celebrate(1,false); render(); bump(); toast(`META DE LEITURA DO DIA BATIDA 📚 +${metaLeit(g)}% hoje · 🔥 ${leitStreak(g)} dia${leitStreak(g)===1?'':'s'} seguidos · +${estrelas} ${STAR}`, {big:true}); return; }
  if(estrelas){ celebrate(0,false); bump(); }
  render();
  const falta = Math.max(0, metaLeit(g) - ganhoHoje());
  toast(novo >= 100 ? 'chegou nos 100%! toca em "terminei" 🥹' : novo > antes ? `${novo}% 📖 ${falta ? `faltam ${falta}% pra meta de hoje` : pick(['a cabeça agradece','um capítulo de paz','leitora raiz ✦'])}${estrelas?` · +${estrelas} ${STAR}`:''}` : `anotado: ${novo}% 📖`);
}

const CAT_PT = {fiction:'ficção', 'juvenile fiction':'juvenil', 'young adult fiction':'jovem adulto', 'biography & autobiography':'biografia', history:'história', 'self-help':'autoajuda', psychology:'psicologia', 'business & economics':'negócios', 'family & relationships':'família', poetry:'poesia', religion:'religião', philosophy:'filosofia', cooking:'culinária', 'health & fitness':'saúde', 'literary criticism':'ensaio', 'social science':'ciências sociais', science:'ciência', 'comics & graphic novels':'quadrinhos', romance:'romance', fantasy:'fantasia', 'true crime':'true crime', education:'educação'};
const SUBJ_PT = [[/fantasy|fantasia/i,'fantasia'],[/romance|love stor/i,'romance'],[/thriller|suspense|mystery|detective|crime/i,'suspense'],[/science fiction|ficção científica/i,'ficção científica'],[/horror|terror/i,'terror'],[/biograph/i,'biografia'],[/self-help|autoajuda/i,'autoajuda'],[/history|história/i,'história'],[/poetry|poesia/i,'poesia'],[/young adult|juvenil/i,'jovem adulto'],[/historical fiction|romance histórico/i,'ficção histórica'],[/fiction|ficção|novel/i,'ficção']];
const normTxt = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ');
function combina(q, alvo){
  const ws = normTxt(q).split(' ').filter(w => w.length >= 3); if(!ws.length) return true;
  const t = ' ' + normTxt(alvo) + ' ';
  return ws.filter(w => t.includes(' ' + w)).length >= Math.ceil(ws.length * 0.6);
}
async function buscarOpenLibrary(q){
  const r = await fetch('https://openlibrary.org/search.json?limit=8&fields=title,subtitle,author_name,number_of_pages_median,subject,language,first_publish_year&q=' + encodeURIComponent(q));
  if(!r.ok) throw new Error(r.status);
  const docs = ((await r.json()).docs || []).filter(d => d.title);
  /* só aceita resultado que tenha de verdade as palavras buscadas (a Open Library devolve qualquer coisa parecida) */
  const d = docs.find(x => combina(q, [x.title, x.subtitle, ...(x.author_name||[])].join(' ')));

  const titulo = d.title + (d.subtitle && d.subtitle.length < 40 ? ': ' + d.subtitle : '');

  set('lf-t', titulo.slice(0,160)); set('lf-a', autor.slice(0,100)); if(pg) set('lf-p', String(pg)); set('lf-g', est);
  ui.busca = {status:'done', msg:`achei: ${titulo}${autor?' · '+autor:''}${est?' · '+est:''}${pg?` · ~${pg} páginas`:''}${d.first_publish_year?` (${d.first_publish_year})`:''}. confere antes de adicionar, pode ser de outra edição.`};
  return true;
}

            <button class="btn" type="submit">ok</button>

        </div>`; }).join('')}
      <form class="addrow" data-form="marco" data-m="${esc(m.id)}"><input class="field" id="nm-${esc(m.id)}" placeholder="+ novo marco (uma etapa da meta)" maxlength="120" aria-label="Novo marco"><button class="btn ghost" type="submit">adicionar</button></form>
      ${a ? `<div class="aibox">${a.status==='loading' ? `<div class="thinking">${STAR} o Claude tá quebrando sua meta em passinhos…</div>`
        : a.status==='error' ? `<p style="margin:0;font-weight:600">${esc(a.msg)}</p><div class="actions"><button class="btn ai" data-act="ai" data-m="${esc(m.id)}">tentar de novo</button><button class="btn ghost" data-act="aiNo" data-m="${esc(m.id)}">fechar</button></div>`
        : `<h5>${STAR} sugestão do Claude</h5><ol>${a.marcos.map(k=>`<li><b>${esc(k.titulo)}</b><ul>${k.passos.map(p=>`<li>${esc(p.titulo)} · ${TLBL[p.tempo]}</li>`).join('')}</ul></li>`).join('')}</ol>
           <div class="actions"><button class="btn red" data-act="aiSim" data-m="${esc(m.id)}">usar esses passinhos</button><button class="btn ghost" data-act="ai" data-m="${esc(m.id)}">outra ideia</button><button class="btn ghost" data-act="aiNo" data-m="${esc(m.id)}">descartar</button></div>`}</div>` : ''}
      <div class="actions">
        ${window.claude && (!a || a.status!=='loading') ? `<button class="btn ai" data-act="ai" data-m="${esc(m.id)}">${STAR} quebrar com o Claude</button>` : ''}
        <button class="btn ghost" data-act="editar" data-m="${esc(m.id)}">editar</button>
        <button class="btn ghost" data-act="apagar" data-m="${esc(m.id)}">apagar meta</button>
      </div>
    </div>`}
  </article>`;
}
function vMetas(){
  const all = metasArr().filter(m => ui.area==='todas' || m.area===ui.area); const hs = ui.horiz==='todos' ? ['curto','medio','longo'] : [ui.horiz];

    <div class="sec-h"><div><h2>suas metas</h2><p class="hint">grande no papel, pequena no passo. toque numa meta pra abrir.</p></div><button class="btn red" data-act="nova">+ nova meta</button></div>
    <div class="chips" style="margin-bottom:8px">${[['todas','todas as áreas'],...Object.entries(AREAS).map(([k,v])=>[k,v.nome])].map(([a,l])=>`<button class="chip" data-act="area" data-a="${a}" aria-pressed="${ui.area===a}" ${a!=='todas'?`style="${ui.area===a?`background:${AREAS[a].cor};border-color:${AREAS[a].cor};color:#fff`:`color:${AREAS[a].cor}`}"`:''}>${l}</button>`).join('')}</div>
    <div class="chips" style="margin-bottom:6px">${[['todos','todo prazo'],['curto','curto'],['medio','médio'],['longo','longo']].map(([h,l])=>`<button class="chip" data-act="horiz" data-h="${h}" aria-pressed="${ui.horiz===h}">${l}</button>`).join('')}</div>
    ${hs.map(h => { const ms = all.filter(m=>(m.horizonte||'curto')===h).sort((a,b)=>(!!a.concluidaEm - !!b.concluidaEm) || String(a.prazo||'9').localeCompare(String(b.prazo||'9')));
      return `<div class="horiz"><div class="horiz-h"><h3>${H[h].nome}</h3><span>${H[h].sub}</span></div>
      ${ms.length ? ms.map(metaCard).join('') : `<div class="empty" style="padding:14px">nenhuma meta de ${H[h].nome} ainda. <button class="btn ghost" style="margin-top:8px" data-act="nova" data-h="${h}">+ criar</button></div>`}</div>`; }).join('')}
  </section>`;
}
function vPote(){
  const g = state.geral || defGeral(); const rs = (g.recompensas||[]);
  const ativas = rs.filter(r=>!r.resgatadaEm).sort((a,b)=>a.custo-b.custo), usadas = rs.filter(r=>r.resgatadaEm);
  return `<section><div class="sec-h"><div><h2>recompensas</h2><p class="hint">o pote serve pra isso: trocar estrela por coisa boa de verdade. passinho de 5 min vale 1, de 15 min vale 2, de 1 h vale 3. marco concluído dá +5, meta concluída +20.</p></div></div>
    <div class="rews">${ativas.length ? ativas.map(r => { const ok = (g.estrelas||0) >= r.custo; return `<div class="rew ${ok?'ready':''}">
      <div><h4>${esc(r.titulo)}</h4><span class="cost num">${r.custo} estrelas ${r.exemplo?'· <span class="tag ex">exemplo</span>':''}</span></div>
      <div style="display:flex;gap:4px;align-items:center"><button class="btn ${ok?'red':'ghost'}" data-act="resgatar" data-r="${esc(r.id)}" ${ok?'':'disabled'}>${ok?'resgatar':`faltam ${r.custo-(g.estrelas||0)}`}</button><button class="x" data-act="delRew" data-r="${esc(r.id)}" aria-label="Apagar recompensa">×</button></div>
      <div class="bar"><i style="width:${Math.min(100,(g.estrelas||0)/r.custo*100)}%"></i></div></div>`; }).join('') : `<div class="empty"><b>nenhuma recompensa ainda</b>pense em coisas pequenas e boas: um café em paz, um banho demorado.</div>`}</div>
  </section>
  <form class="form-card" data-form="rew"><h3 style="font-size:17px">nova recompensa</h3>
    <div class="form-row"><input class="field" id="rw-t" placeholder="ex: banho demorado sem ninguém bater na porta" maxlength="100" aria-label="Recompensa"><input class="field num" id="rw-c" type="number" min="1" max="9999" value="20" style="flex:0 1 110px" aria-label="Custo em estrelas"></div>
    <button class="btn" type="submit">adicionar ao pote</button></form>
  ${usadas.length ? `<section><div class="sec-h"><h2>já curti</h2></div><div class="rews">${usadas.map(r=>`<div class="rew used"><div><h4>${esc(r.titulo)}</h4><span class="cost">resgatada em ${new Date(r.resgatadaEm).toLocaleDateString('pt-BR')}${r.vezes>1?` · ${r.vezes}x`:''}</span></div><button class="btn ghost" data-act="repetir" data-r="${esc(r.id)}">quero de novo</button></div>`).join('')}</div></section>` : ''}`;

/* prêmios = recompensas + vitórias numa aba só */
function vPremios(){

}
function vVitorias(){
  const g = state.geral || defGeral(); const h = g.historico||{};
  const cells = []; const end = new Date(); const start = new Date(end); start.setDate(start.getDate() - (7*12 - 1) - end.getDay());
  for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)){ const n = h[dk(d)]||0; cells.push(`<i data-l="${n>=5?3:n>=3?2:n>=1?1:0}" title="${dk(d)}: ${n}"></i>`); }
  const concl = metasArr().filter(m=>m.concluidaEm);
  return `<div class="selo">${STAR}<small>vitória nº</small><b class="num">${g.vitorias||0}</b><span>${g.total||0} estrelas ganhas no total</span></div>

    ${concl.length ? `<div class="estante">${concl.sort((a,b)=>String(b.concluidaEm).localeCompare(String(a.concluidaEm))).map(m=>`<div class="taca" style="--area:${areaVar(m)}"><span aria-hidden="true">🏆</span><b>${esc(m.titulo)}</b><small>${new Date(m.concluidaEm).toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})}</small></div>`).join('')}</div>`
      : `<div class="empty"><b>a estante tá esperando o primeiro troféu</b>cada meta concluída vira uma taça aqui.</div>`}</section>
  <section><div class="sec-h"><h2>mural de vitórias</h2></div>${(g.ultimas||[]).length ? `<ul class="wins">${g.ultimas.map(u=>`<li><span class="n num">nº ${u.n}</span><div class="t"><b>${esc(u.t)}</b><small>${esc(u.meta)} · ${new Date(u.em).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})}</small></div></li>`).join('')}</ul>` : `<div class="empty"><b>o mural tá esperando</b>cada passinho riscado vira uma vitória numerada aqui.</div>`}</section>`;
}

/* ---------- folha de meta ---------- */

function closeSheet(){ $('#sheet').hidden = true; $('#sheet').innerHTML=''; ui.edit=null; }

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if(t){ ui.tab = t.dataset.tab; ui.confirm=null; render(); window.scrollTo({top:0}); return; }
  const b = e.target.closest('[data-act]'); if(!b) { if(e.target.id==='sheet') closeSheet(); return; }
  const {act, m, k, p, r} = b.dataset;
  if(!['apagar','apagarSim'].includes(act)) ui.confirm = null;
  switch(act){
    case 'toggle': toggle(m,k,p); break;
    case 'agPermitir': agPermitir(); break;
    case 'buscarLivro': buscarLivro(); break;
    case 'hab': toggleHab(b.dataset.id); break;
    case 'habDia': toggleHab(b.dataset.id, b.dataset.d); break;
    case 'delHab': delHab(b.dataset.id); break;

    case 'verFeitas': ui.feitas = !ui.feitas; render(); break;

    case 'maisPassos': ui.maisPassos = !ui.maisPassos; render(); break;
    case 'editLiv': ui.editLiv = b.dataset.id; render(); break;

    case 'terminar': terminar(b.dataset.id); break;
    case 'comecar': comecar(b.dataset.id); break;
    case 'statusLiv': statusLiv(b.dataset.id, b.dataset.s); break;
    case 'notaLiv': notaLiv(b.dataset.id, b.dataset.n); break;

    case 'open': ui.open.has(m) ? ui.open.delete(m) : ui.open.add(m); render(); break;
    case 'delPasso': delPasso(m,k,p); break;
    case 'delMarco': delMarco(m,k); break;
    case 'apagar': ui.confirm = m; render(); break;

    case 'esqueci': esqueci(); break;
    case 'avisosOn': avisosLigar(); break;
    case 'avisosNao': try{ localStorage.setItem('metas-avisos-nao', '1'); }catch(_){} render(); break;
    case 'agTrocar': ag.st = 'pedir'; render(); break;
    case 'sair': sb.auth.signOut(); break;
    case 'ai': quebrar(m); break;
    case 'aiSim': usarAI(m); break;
    case 'aiNo': delete ui.ai[m]; render(); break;
    case 'resgatar': resgatar(r); break;
    case 'repetir': repetir(r); break;
    case 'delRew': delRew(r); break;
    case 'som': som = !som; try{ localStorage.setItem('metas-som', som?'on':'off'); }catch(_){} render(); if(som) plim(0); break;
    case 'exemplos': EX.metas.forEach(x => { state.metas[x.id] = clone(x); saveMeta(x.id); }); { const g = clone(state.geral||defGeral()); if(!g.recompensas.length) g.recompensas = clone(EX.recompensas).map(r=>({...r,exemplo:true})); state.geral=g; saveGeral(); } ui.tab='metas'; render(); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  const {form, m, k} = f.dataset;
  if(form==='passo'){ const i = $(`#np-${CSS.escape(m)}-${CSS.escape(k)}`), s = $(`#nt-${CSS.escape(m)}-${CSS.escape(k)}`); const v=i.value; i.value=''; addPasso(m,k,v,s.value); const ni=document.getElementById(i.id); if(ni) ni.focus(); }
  if(form==='marco'){ const i = $(`#nm-${CSS.escape(m)}`); const v=i.value; i.value=''; addMarco(m,v); }
  if(form==='login'){ entrar($('#lg-e').value.trim(), $('#lg-s').value); }
  if(form==='novaSenha'){ novaSenha($('#lg-n').value); }
  if(form==='ics'){ salvarIcs($('#ag-ics').value.trim()); }
  if(form==='editLiv'){ salvarLivro(f.dataset.id); }
  if(form==='pag'){ const i = document.getElementById('lp-'+f.dataset.id); if(i){ const v = i.value; i.value=''; setPagina(f.dataset.id, v); } }
  if(form==='liv'){ const t=$('#lf-t'), a=$('#lf-a'), p=$('#lf-p'), gn=$('#lf-g'); const tv=t.value, av=a.value, pv=p.value, gv=gn?gn.value:''; t.value=''; a.value=''; p.value=''; if(gn) gn.value=''; ui.busca = null; addLiv(tv, av, pv, $('#lf-s').value, gv); }
  if(form==='hab'){ const t=$('#hf-t'); const v=t.value; t.value=''; addHab(v, $('#hf-a').value, $('#hf-m').value); const n=$('#hf-t'); if(n) n.focus(); }
  if(form==='tar'){ const t=$('#tf-t'), d=$('#tf-d'); const v=t.value, dv=d.value; t.value=''; d.value=''; addTar(v, $('#tf-a').value, dv); const n=$('#tf-t'); if(n) n.focus(); }
  if(form==='rew'){ const t=$('#rw-t'), c=$('#rw-c'); const tv=t.value; t.value=''; addRew(tv,c.value); }
  if(form==='meta'){
    const titulo = $('#f-titulo').value.trim(); if(!titulo) return;
    const data = {titulo, porque:$('#f-porque').value.trim(), horizonte:$('#f-h').value||'curto', area:$('#f-area').value, prazo:$('#f-prazo').value};
    let id = ui.edit; const isNew = !id;
    if(id){ const mm = norm(state.metas[id]); Object.assign(mm, data); delete mm.exemplo; state.metas[id] = mm; }
    else { id = uid('m'); state.metas[id] = {id, ...data, criadoEm:new Date().toISOString(), marcos:[]}; ui.open.add(id); ui.horiz='todos'; }
    saveMeta(id); closeSheet(); ui.tab='metas'; render();
    toast(isNew ? 'meta criada! agora quebra ela em passinhos ✦' : 'salvo ✦');
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---------- dopamina: toast, som, confete ---------- */
let toastT;
function toast(html, o={}){
  const host = $('#toastHost'); clearTimeout(toastT);
  host.innerHTML = `<div class="toast ${o.big?'big':''}" role="status"><span>${html}</span>${o.undo?'<button id="undoBtn">desfazer</button>':''}</div>`;
  if(o.undo) $('#undoBtn').onclick = () => { host.innerHTML=''; o.undo(); };
  toastT = setTimeout(()=>host.innerHTML='', o.big ? 4200 : 3200);
}
function bump(){ const p = $('#pote'); p.classList.remove('pop'); void p.offsetWidth; p.classList.add('pop'); }
let actx;
function plim(level){
  if(!som) return; try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const notes = level===2 ? [523,659,784,1047,1319] : level===1 ? [659,784,1047] : [784,1175];
    notes.forEach((f,i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type='triangle'; o.frequency.value=f;
      const t = actx.currentTime + i*0.07; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+0.4); });
  }catch(e){}
}
const fx = $('#fx'), cx = fx.getContext('2d'); let parts = [], raf = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function celebrate(level, bonus){
  plim(level); try{ navigator.vibrate && navigator.vibrate(level ? [20,40,20] : 15); }catch(e){}
  if(reduce) return;
  const dpr = devicePixelRatio||1; fx.width = innerWidth*dpr; fx.height = innerHeight*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  const css = getComputedStyle(document.documentElement);
  const cores = ['--verm','--roxo','--amar','--rosa','--verde','--azul'].map(v=>css.getPropertyValue(v).trim());
  const n = level===2 ? 160 : level===1 ? 90 : bonus ? 60 : 28;
  const ox = level ? innerWidth/2 : innerWidth*0.5, oy = level ? innerHeight*0.35 : innerHeight*0.55;
  for(let i=0;i<n;i++){ const a = Math.random()*Math.PI*2, sp = (level?7:4.5) + Math.random()*(level?8:5);
    parts.push({x:ox,y:oy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(level?5:3),r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:4+Math.random()*(level?9:6),c:cores[i%cores.length],star:Math.random()<.45,life:1}); }
  if(!raf) raf = requestAnimationFrame(tick);
}
function drawStar(s){ cx.beginPath(); cx.moveTo(0,-s); cx.quadraticCurveTo(s*.15,-s*.15,s,0); cx.quadraticCurveTo(s*.15,s*.15,0,s); cx.quadraticCurveTo(-s*.15,s*.15,-s,0); cx.quadraticCurveTo(-s*.15,-s*.15,0,-s); cx.fill(); }
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p => { p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .011;
    cx.save(); cx.globalAlpha = Math.max(0,p.life); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if(p.star) drawStar(p.s); else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.restore(); });
  parts = parts.filter(p => p.life>0 && p.y < innerHeight+40);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,innerWidth,innerHeight), 0);
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
boot();
})();
